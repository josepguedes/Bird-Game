<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Left Wing Gradient -->
    <linearGradient id="wingLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Right Wing Gradient -->
    <linearGradient id="wingRightGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Gold Feather Accent Gradient -->
    <linearGradient id="goldFeatherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Body Gradient -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Cyber Energy Core Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Soft Drop Shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0284c7" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Container Base with rounded corners -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="6" filter="url(#softShadow)" />
  
  <!-- Tech Radar Rings background -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.25" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4 6" opacity="0.2" />

  <!-- Bird Group -->
  <g transform="translate(0, 10)">
    <!-- Outer Wing Feathers - Left (Cyan Neon) -->
    <path d="M 256 210 Q 180 120 70 90 C 110 160 140 210 190 260 C 210 280 230 290 256 300 Z" 
          fill="url(#wingLeftGrad)" filter="url(#neonGlow)" opacity="0.95" />
    
    <!-- Outer Wing Feathers - Right (Cyan Neon) -->
    <path d="M 256 210 Q 332 120 442 90 C 402 160 372 210 322 260 C 302 280 282 290 256 300 Z" 
          fill="url(#wingRightGrad)" filter="url(#neonGlow)" opacity="0.95" />

    <!-- Top Primary Wing Blades - Left -->
    <path d="M 256 190 Q 170 80 50 60 C 100 130 150 180 210 220 Z" 
          fill="url(#wingLeftGrad)" />

    <!-- Top Primary Wing Blades - Right -->
    <path d="M 256 190 Q 342 80 462 60 C 412 130 362 180 302 220 Z" 
          fill="url(#wingRightGrad)" />

    <!-- Secondary Accent Feathers - Gold Left -->
    <path d="M 256 230 Q 190 170 110 150 C 150 200 190 240 230 270 Z" 
          fill="url(#goldFeatherGrad)" filter="url(#neonGlow)" />

    <!-- Secondary Accent Feathers - Gold Right -->
    <path d="M 256 230 Q 322 170 402 150 C 362 200 322 240 282 270 Z" 
          fill="url(#goldFeatherGrad)" filter="url(#neonGlow)" />

    <!-- Tail Feathers -->
    <path d="M 256 310 L 220 420 L 256 390 L 292 420 Z" fill="url(#goldFeatherGrad)" />
    <path d="M 256 300 L 235 440 L 256 415 L 277 440 Z" fill="url(#wingLeftGrad)" opacity="0.85" />

    <!-- Main Bird Body Shield -->
    <path d="M 256 140 C 230 180 225 240 235 310 C 245 330 256 345 256 345 C 256 345 267 330 277 310 C 287 240 282 180 256 140 Z" 
          fill="url(#bodyGrad)" filter="url(#softShadow)" />

    <!-- Eagle Head & Crest -->
    <path d="M 256 105 C 240 120 238 142 242 165 L 256 175 L 270 165 C 274 142 272 120 256 105 Z" 
          fill="#ffffff" />
    
    <!-- Golden Cyber Beak -->
    <path d="M 256 148 L 246 162 L 256 185 L 266 162 Z" fill="url(#goldFeatherGrad)" />
    
    <!-- Cyber Energy Core (Chest Diamond) -->
    <polygon points="256,215 272,240 256,265 240,240" fill="url(#coreGrad)" stroke="#ffffff" stroke-width="2" filter="url(#neonGlow)" />

    <!-- Glowing Eyes -->
    <circle cx="247" cy="142" r="3.5" fill="#0284c7" />
    <circle cx="265" cy="142" r="3.5" fill="#0284c7" />
    <circle cx="247" cy="142" r="1.5" fill="#38bdf8" />
    <circle cx="265" cy="142" r="1.5" fill="#38bdf8" />
  </g>
</svg>
